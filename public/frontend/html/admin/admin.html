<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="پنل ادمین سایت روهین. ثبت محصول و دریافت گزارشات فروش"
    />
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="../../styles/home/flexboxgrid.css" />
    <link rel="stylesheet" href="../../styles/admin/admin.css" />
    <link rel="stylesheet" href="../../styles/admin/order.css" />
    <link rel="stylesheet" href="../../styles/admin/report.css" />
    <link rel="stylesheet" href="../../styles/admin/product.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <title>پنل مدیریت ادمین</title>
  </head>
  <body>
    <main>
      <div class="right">
        <div class="menu-btns">
          <div class="item item-active" data-page="profile">
            <i class="fa-solid fa-user"></i>
            <span>پروفایل ادمین</span>
          </div>

          <div class="item" data-page="add-product">
            <i class="fa-solid fa-layer-group"></i>
            <span>اضافه کردن محصول</span>
          </div>

          <div class="item" data-page="orders">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>سفارش ها</span>
          </div>

          <div class="item" data-page="reports">
            <i class="fa-solid fa-message"></i>
            <span>گزارش ها</span>
          </div>

          <div class="item" data-page="support">
            <i class="fa-solid fa-headset"></i>
            <span>پشتیبانی</span>
          </div>
        </div>
      </div>
      <div class="left">
        <h2>درحال بارگذاری</h2>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/scripts/admin/admin.js" type="module"></script>
    <script src="/scripts/admin/changeItem.js" type="module"></script>
    <script src="/scripts/admin/profile.js" type="module"></script>
    <script src="/scripts/admin/product.js" type="module"></script>
